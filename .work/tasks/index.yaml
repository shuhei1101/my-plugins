# フィールド説明:
#   id        : PR 番号（連番）
#   title     : PR フォルダの h1 タイトルそのまま
#   type      : feat / fix / docs / refactor / chore / test
#   tags      : 自由形式タグ（省略可）
#   summary   : ファイルを開かずに内容がわかる一行説明
#   task      : タスクフォルダ名（YYYYMMDD_{title}）
#   completed : false = 進行中、true = マージ済み / 廃止済み

