<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script src="{{ '/assets/app.js' | relative_url }}" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></div>
  </header>
  <main class="main">
    <nav class="breadcrumb" data-breadcrumb></nav>
    <article class="markdown-body">
      {{ content }}
    </article>
    <button class="back-to-top" data-back-to-top aria-label="トップへ戻る">↑</button>
  </main>
</body>
</html>
