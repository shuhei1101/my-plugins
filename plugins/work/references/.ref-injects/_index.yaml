# work reference index (English; parsed by inject_references.py).
# Each entry maps a reference file to a one-line description.
#   path        : path relative to this references/ directory
#   description : shown in the injected pointer (and as the section heading)
# Keep this in sync with _index.jp.yaml and _injection_rules.yaml.
references:
  - path: skill-sync/ストッププロンプト同期.md
    description: Sync rule for work stop.md and stop-no-merge.md. The two files are a paired set; steps 1-3 must stay in sync between them. When editing either file, apply the same change to the other.

  - path: skill-sync/マージスキル同期.md
    description: Sync rule for work merge SKILL.md and the merge-flow note. When adding, removing, or reordering steps in SKILL.md, update the merge-flow description in .work/notes/work-kitスキル群.md so the note keeps reflecting the actual behavior.

  - path: skill-sync/スタートスキル同期.md
    description: Sync rule for work-start, worktree-create, and vscode-workspace-sync skills. work-start Step 4 delegates to worktree-create, so their interfaces must stay aligned.

  - path: work-dir/ワークディレクトリ構成.md
    description: High-level map of .work/ — directory structure, the role of each subfolder (tasks/notes/issues), and commit conventions (keep .work/ changes in a separate commit from implementation code). Points to the per-subfolder detail references.

  - path: work-dir/タスクドキュメント.md
    description: Branch document template and section fill-in guide. The branch document is the single source of truth for one branch; created at .work/tasks/{folder}/{YYMMDD}-{日本語タイトル}.branch.md. Author it directly from the injected template.

  - path: work-dir/タスクインデックス.md
    description: Schema for .work/tasks/index.yaml (active branch index, git-ignored) and index.archive.yaml (archived branches). Normally maintained by index-tool.py and the merge skill.

  - path: work-dir/イシュー.md
    description: Issue file format (.work/issues/ISSUE-{N}.md) and the _index.yaml / _index.archive.yaml schema. issue-scan / issue-create author issue files from this template.

  - path: notes/ノート命名規則.md
    description: Naming and index rules for .work/notes/ files. File names and H1 titles must be in Japanese (technical identifiers stay as-is). Always update _index.md in the same commit when creating, renaming, or deleting a note.

  - path: notes/ノート記述内容ルール.md
    description: What to write in a .work/notes/ note, plus the fixed note template. A note is a current spec sheet (snapshot) — write only the present state, no history/rationale in the body; record change only in the trailing 変更履歴 table. No YAML frontmatter.

  - path: conversation/用語集.md
    description: Inclusion bar and file format for the project glossary (.claude/rules/glossary.md, always loaded). Register a term only if it is project-specific, non-obvious from its name, recurring, and not already in CLAUDE.md / a rule / a skill description / the folder structure. When in doubt, discard.

  - path: conversation/インシデント.md
    description: Inclusion bar and file format for the recurrence-prevention log (incidents) — index .claude/rules/incidents.md (always loaded) + detail .claude/references/incidents/{slug}.md. Record only a real mistake that happened this session, generalizable, and not already enforced by a rule / CLAUDE.md / hook. If a rule should exist, create the rule instead.
