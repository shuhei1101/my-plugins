# work リファレンス索引（日本語ミラー；人間用）。
# WORK_INJECTION_LANG=jp のとき inject_references.py が description をここから取る。
# _index.yaml（英語・正本）と _injection_rules.yaml に常に同期させること。
references:
  - path: ストッププロンプト同期.md
    description: work の stop.md と stop-no-merge.md の同期ルール。この 2 ファイルは対称な組であり、ステップ 1〜3 を両ファイルで一致させること。いずれかを編集したら同じ変更をもう片方にも適用する。

  - path: マージスキル同期.md
    description: work の merge SKILL.md とマージフロー仕様書の同期ルール。SKILL.md でステップを追加・削除したら、.work/specs/work-kit-merge-flow.md のステップ番号参照も更新する。

  - path: スタートスキル同期.md
    description: work-start・worktree-create・vscode-workspace-sync スキルの同期ルール。work-start の Step 4 は worktree-create に委譲するため、インターフェースを常に整合させること。

  - path: TODOテンプレート同期.md
    description: work TODO テンプレートと work-start SKILL.md の同期ルール。テンプレートのセクション構成は work-start SKILL.md Step 7 の記入ガイドと一致させること。

  - path: ドットワークディレクトリ構成.md
    description: .work/ 配下のファイルを編集する際のガイド — ディレクトリ構成・ブランチドキュメントのセクション構成・notes のライフサイクル・コミット規約（.work/ 配下の変更は実装コードと別コミットにすること）。

  - path: ノート命名規則.md
    description: .work/notes/ ファイルの命名・インデックス管理ルール。ファイル名と H1 タイトルは日本語（技術識別子はそのまま）。ノートを新規作成・リネーム・削除したときは同じコミットで _index.md も更新する。
