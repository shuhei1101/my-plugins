/** Mock tab switcher */
(() => {
  const tabs = /** @type {NodeListOf<HTMLButtonElement>} */ (document.querySelectorAll(".l-mockTabs__tab"));
  const panels = /** @type {NodeListOf<HTMLElement>} */ (document.querySelectorAll(".p-variant"));

  /** @param {string} variant */
  function show(variant) {
    tabs.forEach(t => t.setAttribute("aria-selected", t.dataset.variant === variant ? "true" : "false"));
