# __PLUGIN_NAME__ injection rules — edit-path pattern -> references (language-independent).
#   pattern  : glob matched against the edited file path
#              ** = any depth, * = single segment, ? = one char, {a,b} = alternation
#              Prefix by-name folders with **/ (e.g. **/tools/**/*.py) so they match in subprojects.
#   required : reference paths injected in FULL BODY (the must-read conventions)
#   optional : reference paths injected as POINTER ONLY (path + description); Claude reads on demand
# Match is first-rule-wins-agnostic: every matching rule contributes its references (de-duplicated).
rules:
  - pattern: "**/*.example"
    required:
      - example/getting-started.md
    optional: []
