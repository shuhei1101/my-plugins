# __PLUGIN_NAME__ の注入ルール — 編集ファイルのパスパターン → リファレンス（言語非依存）
#   pattern  : 編集ファイルのパスに対して glob でマッチさせる
#              ** = 任意の深さ / * = 1 セグメント / ? = 1 文字 / {a,b} = 選択
#              名前ベースのフォルダ指定は `**/` を前置してサブプロジェクトでもマッチさせる
#              （例: `**/tools/**/*.py`）
#   required : 本文ごとフル注入されるリファレンスのパス（必ず読むべき規約）
#   optional : パス＋説明のみが注入されるリファレンス（Claude が必要に応じて Read する）
# 「先勝ち」ではなく、マッチしたルールはすべて寄与する（重複排除あり）。
rules:
  - pattern: "**/*.example"
    required:
      - example/getting-started.md
    optional: []
