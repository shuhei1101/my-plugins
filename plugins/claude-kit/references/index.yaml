# claude-kit reference index (English; parsed by inject_references.py).
# Each entry maps a reference file to a one-line description.
#   path        : path relative to this references/ directory
#   description : shown in the injected pointer (and as the section heading)
# Keep this in sync with index.jp.yaml (JP mirror) and injection_rules.yaml.
references:
  - path: common.md
    description: Shared base for all Claude config authoring. File-type decision criteria (rule vs skill vs CLAUDE.md vs hook vs reference), anti-proliferation guard, and JP/EN mirror rules.

  - path: provenance.md
    description: How to stamp a generated/edited file with provenance metadata (the Generated-by comment). Per-extension comment format, version from plugin.json, placement after frontmatter, JP-mirror warning line, and the replace-existing rule. Source of truth for the mark-generated thin wrapper.

  - path: skills.md
    description: How to author a .claude/skills/<name>/SKILL.md. When a skill is the right type, checking for existing similar skills, the JP-mirror-first workflow, the step-based structure template, and description frontmatter rules.

  - path: rules.md
    description: How to author a .claude/rules/<name>.md. When rules load, the two rule types (link / context), use-case-oriented path-pattern design, consolidation/separation criteria, folder structure, required sections, and the structure example.

  - path: hooks.md
    description: How to author a prompt-injection hook. Hook events, the injection mechanism, when to use hooks, loop prevention (stop_hook_active / one-time token), ready-to-use hooks.json snippets, prompt-file placement, and path variables.

  - path: claude-md.md
    description: How to author a CLAUDE.md (root or subfolder). When it loads, the thinness principle, extraction-destination guide, validation against other file types, the JP-mirror-first workflow, required sections, and the line-count guideline.

  - path: plugin-structure.md
    description: How to author or update a plugin. Standard directory layout, plugin.json fields, marketplace.json entry, create-vs-update mode, version bump rules, the plugin.json/marketplace.json/changelog version-sync invariant, and changelog format.

  - path: glossary.md
    description: Format guide for .claude/rules/glossary.md. Single-file category-organized terminology table, writing discipline (always-loaded → keep terse), and how terms get added.

  - path: incidents.md
    description: Format guide for .claude/rules/incidents.md. Two-layer index + detail-file structure for recurrence-prevention logs, and how incidents get recorded.
