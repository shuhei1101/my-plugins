# claude-kit の注入ルール — 編集ファイルのパスパターン → リファレンス（言語非依存）
#   pattern  : 編集ファイルのパスに対して glob でマッチさせる
#              ** = 任意の深さ / * = 1 セグメント / ? = 1 文字 / {a,b} = 選択
#              名前ベースのフォルダ指定は `**/` を前置してサブプロジェクトでもマッチさせる
#   required : 本文ごとフル注入されるリファレンスのパス（必ず読むべき執筆ガイド）
#   optional : パス＋説明のみが注入されるリファレンス（Claude が必要に応じて Read する）
# マッチしたルールはすべて寄与する（重複排除あり）。common/共通ガイド.md は共通ベース
# （ファイル種別の判断、JP/EN ミラーのルール）。
# common/環境変数.md（環境変数による設定方法）は、すべての Claude 用成果物（Write/Edit）に対して
# 注入する — 設定可能な挙動が存在することを著者に意識させるため。実際に env を設定する場所
# （hooks.json / settings.json）ではフル本文で、それ以外では pointer-only（optional）で出す。
rules:
  # ---- Skills: SKILL.md（あるいはその JP ミラー）を編集する場合 ----
  - pattern: "**/skills/*/SKILL{.jp,}.md"
    required:
      - common/共通ガイド.md
      - skill/スキル.md
    optional:
      - common/サブエージェント.md
      - common/環境変数.md
      - common/環境変数記法.md
      - common/AskUserQuestion制約.md
      - plugin/プラグイン設定.md

  # ---- References: プラグインのリファレンスファイルを編集する場合 ----
  - pattern: "plugins/*/references/**/*.md"
    required:
      - common/リファレンス同期.md
    optional: []

  # ---- *-kit 注入構造ファイル: dev-kit / claude-kit の共有構造を編集する場合 ----
  - pattern: "plugins/*-kit/hooks/scripts/*.py"
    required:
      - hook/キットフック同期.md
    optional: []
  - pattern: "plugins/*-kit/hooks/templates/*.j2"
    required:
      - hook/キットフック同期.md
      - hook/jinja2/執筆ガイド.md
    optional: []

  # ---- Jinja2 テンプレート（任意プラグインの hooks/templates/*.j2）：Markdown 出力時の落とし穴 ----
  - pattern: "**/hooks/templates/*.j2"
    required:
      - hook/jinja2/テンプレート注意点.md
    optional: []
  - pattern: "plugins/*-kit/references/.ref-inject/{_index,_injection_rules,CLAUDE}{.jp,}.{yaml,md}"
    required:
      - hook/キットフック同期.md
    optional: []

  # ---- CLAUDE.md: プロジェクト／サブフォルダのメモリファイル ----
  - pattern: "**/CLAUDE{.local,.jp,}.md"
    required:
      - common/共通ガイド.md
      - claude-md/CLAUDE-md記述ガイド.md
    optional:
      - common/環境変数.md
      - common/環境変数記法.md

  # ---- Hooks: プラグインの hooks.json、プロジェクト設定（JSON はスタンプなし）、プロンプトファイル（.md） ----
  # settings.json / hooks.json は env ブロックを持つため、ここでは 環境変数.md をフル注入する。
  - pattern: "**/hooks/hooks.json"
    required:
      - common/共通ガイド.md
      - hook/フック.md
      - common/環境変数.md
  - pattern: "**/.claude/settings{.local,}.json"
    required:
      - common/共通ガイド.md
      - hook/フック.md
      - common/環境変数.md
  - pattern: "**/hooks/prompts/*.md"
    required:
      - hook/フック.md
    optional:
      - common/環境変数.md
      - common/環境変数記法.md

  # ---- Plugins: マニフェスト／マーケットプレイス（JSON はスタンプなし） ----
  - pattern: "**/.claude-plugin/{plugin,marketplace}.json"
    required:
      - common/共通ガイド.md
      - plugin/プラグイン構造.md
      - plugin/バージョン同期.md
    optional:
      - common/環境変数.md
      - plugin/プラグイン設定.md

  # ---- プラグインの CLAUDE.md: プラグインディレクトリ直下の CLAUDE.md ----
  # 上の汎用 **/CLAUDE.md パターンに、プラグイン固有の執筆ガイドを上乗せする。
  # バージョン同期.md を required にすることで、CLAUDE.md 編集時もバージョン同期 reminder が出る。
  - pattern: "plugins/*/CLAUDE{.jp,}.md"
    required:
      - plugin/プラグインCLAUDE-md.md
      - plugin/バージョン同期.md
    optional:
      - common/環境変数.md
